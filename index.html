  if(rainy&&below){if(storm?rl(5,3,8,3,5,2):rl(3,4,9,3,8,2))return"rainFar"}
  if(cond==="snow"&&v>=st_&&ph(u,v-fl(tick/2),88)%19===0)return"rainFar";

function decor(b,kind,fx,fw,sy,cond,day,tick){
  const fair=cond==="clear"||cond==="partly";
  if(kind==="cat"){
    const fl_=cond==="storm"&&mod(tick,4)===0,aw=(day&&fair&&mod(tick,3)===0)||fl_;
    const spr=[".#.....#.",".##...##.",".#######.",aw?"##o###o##":"#--###--#",aw?"##o#n#o##":"####n####",".#######.","##sssss##","##sssss##"];
    const cx=fx+fl(fw/4)-4,cy=sy-8;
    b.stamp(spr,{"#":"catBody","s":"catBelly","o":"catEye","-":"catEye","n":"catNose"},cx,cy);
    const sw=fair&&day,tail=(sw&&mod(tick,2)===0)?[[9,6],[10,5],[10,4],[11,3]]:[[9,7],[10,7],[11,6],[12,6]];
    for(const[dx,dy]of tail)b.set(cx+dx,cy+dy,"catBody");
  }else if(kind==="plants"){
    const mp={"l":"plantLeaf","L":"plantLeafDark","c":"plantLeafDark","f":"plantBloom","p":"pot","P":"potShade"};
    b.stamp([".l.l.","lLlLl",".lLl.","..l..","ppppp",".PPP."],mp,fx+2,sy-6);

}

function windowDraw(b,ox,oy,width,height,o,cond,day,tick){
  const mat=o.mat,shape=o.shape,panes=o.panes,t=o.thick,sill=o.sill;
  const hs=shape!=="round",over=hs?1:0,sH=hs?2:0,m=t>=3?2:1;

  const dist=Array.from({length:fh},()=>new Array(fw).fill(0)),q=[];

    if(ins[y][x]&&(x===0||y===0||x===fw-1||y===fh-1||!ins[y][x-1]||!ins[y][x+1]||!ins[y-1][x]||!ins[y+1][x])){dist[y][x]=1;q.push([x,y])}}
  for(let i=0;i<q.length;i++){const[x,y]=q[i];
    for(const[nx,ny]of[[x-1,y],[x+1,y],[x,y-1],[x,y+1]]){
      if(nx>=0&&nx<fw&&ny>=0&&ny<fh&&ins[ny][nx]&&dist[ny][nx]===0){dist[ny][nx]=dist[y][x]+1;q.push([nx,ny])}}}

  const bw=mxX-mnX+1,bh=mxY-mnY+1;

  const ga=(x,y)=>!out(x,y)&&dist[y][x]>t;
  const mull=(x,y)=>{
    if(!has)return false;
    const u=x-mnX,v=y-mnY,vc=fl((bw-m)/2),hc=fl((bh-m)/2),vb=vc<=u&&u<vc+m,hb=hc<=v&&v<hc+m;
    if(panes==="single")return false;
    if(panes==="split")return vb;
    if(panes==="cross")return vb||hb;

    return (a<=u&&u<a+m)||(bb<=u&&u<bb+m)||hb;};

    if(d===1){

      if(out(x,y+1)||out(x+1,y)){b.set(gx,gy,"frameDark");continue}}
    if(d===t){

      if(ga(x,y-1)||ga(x-1,y)){b.set(gx,gy,"frameLight");continue}}

  if(hs){for(let sx=0;sx<fw+over*2;sx++){b.set(ox+sx,sy,"frameLight");b.set(ox+sx,sy+1,"frameDark")}}
  const iw=(gx,gy)=>{const x=gx-fx,y=gy-oy;if(x>=0&&x<fw&&y>=0&&y<fh)return ins[y][x];
    return hs&&sy<=gy&&gy<sy+sH&&ox<=gx&&gx<ox+fw+over*2};
  for(let gy=oy-1;gy<sy+sH+1;gy++)for(let gx=ox-1;gx<ox+fw+over*2+1;gx++){
    if(!iw(gx,gy)&&(iw(gx-1,gy)||iw(gx+1,gy)||iw(gx,gy-1)||iw(gx,gy+1)))b.set(gx,gy,"outline");}

function labels(b,m,time,temp,place){
  const put=(t,x,y,ink)=>{
    if(!t)return;

    for(let yy=y-1;yy<y+6;yy++)for(let xx=x-1;xx<x+w+1;xx++)

  p=fit(p,b.w-m*2);put(p,fl((b.w-tw(p))/2),b.h-m-5,"textDim");
}

function composeHome(cols,rows,o,cond,day,time,place,tick,temp,withLabels){
  const b=new Buf(cols,rows);

  const m=5,band=m+5+3,bw=cols-m*2,bh=rows-band*2,asp=cols/rows;

// ---- painters ----
const css=(c,a)=>a===undefined?`rgb(${c[0]},${c[1]},${c[2]})`:`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const lum=c=>(0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255;
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r=>r.map(v=>(v+.5)/16));

function paintPixel(ctx,b,pal,ps,K,ox,oy,W,H){
  const P=Math.round(ps*K);ctx.fillStyle=css(pal.wall);ctx.fillRect(0,0,W,H);
  let cur=null;
  for(let y=0;y<b.h;y++){let x=0;while(x<b.w){const k=b.p[y][x];let run=1;while(x+run<b.w&&b.p[y][x+run]===k)run++;
    if(k!=="clear"&&pal[k]){if(cur!==k){ctx.fillStyle=css(pal[k]);cur=k}ctx.fillRect(ox+x*P,oy+y*P,run*P,P)}x+=run}}
}
function paintDither(ctx,b,pal,ps,K,ox,oy,W,H){
  const P=Math.round(ps*K),s=Math.round(ps),dd=P/s,dark=rgb(LOOK.dd),light=rgb(LOOK.dl);
  ctx.fillStyle=css(dark);ctx.fillRect(0,0,W,H);
  const LM=Array.from({length:b.h},()=>new Array(b.w).fill(null));
  for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){const k=b.p[y][x];if(k!=="clear")LM[y][x]=Math.min(1,Math.max(0,(lum(pal[k])-.08)/.84))}
  for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){const k=b.p[y][x];
    if(k==="text"||k==="textDim"){const lt=lum(pal[k])>=.5;LM[y][x]=lt?2:-2;
      for(let dy=-2;dy<3;dy++)for(let dx=-2;dx<3;dx++){const nx=x+dx,ny=y+dy;
        if(nx>=0&&nx<b.w&&ny>=0&&ny<b.h){const kk=b.p[ny][nx];if(kk!=="text"&&kk!=="textDim"&&kk!=="clear")LM[ny][nx]=lt?-2:2}}}}
  const path=new Path2D();
  for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){const L=LM[y][x];if(L===null)continue;
    for(let sy=0;sy<s;sy++)for(let sx=0;sx<s;sx++){const gx=x*s+sx,gy=y*s+sy;
      if(L>BAYER[gy&3][gx&3])path.rect(ox+gx*dd,oy+gy*dd,dd,dd)}}
  ctx.fillStyle=css(light);ctx.fill(path);
}
function paintHalftone(ctx,b,pal,ps,K,ox,oy,W,H,day){
  const P=Math.round(ps*K),cell=2*P,paper=rgb(LOOK.paper),blue=rgb(LOOK.blue),pink=rgb(LOOK.pink);
  const bc=blue.map((v,i)=>Math.trunc(v*.9+paper[i]*.1));
  ctx.fillStyle=css(paper);ctx.fillRect(0,0,W,H);
  const solid=[],bl=new Path2D(),pk=new Path2D();
  for(let cy=0;cy<b.h;cy+=2)for(let cx=0;cx<b.w;cx+=2){
    let A=0,M=0,n=0;
    for(let y=cy;y<Math.min(cy+2,b.h);y++)for(let x=cx;x<Math.min(cx+2,b.w);x++){const k=b.p[y][x];
      if(k==="clear")continue;
      if(k==="text"||k==="textDim"||k==="outline"){solid.push([x,y]);continue}
      if(k==="wall"||k==="wallLine"||k==="wallAccent"){n++;continue}
      const c=pal[k];A+=Math.pow(1-c[0]/255,1.4);M+=Math.pow(1-c[1]/255,1.4);n++;}
    if(n===0)continue;A/=n;M/=n;if(!day){A*=.7;M*=.7}

    if(A>.04){const r=Math.sqrt(A)*cell*.62;bl.moveTo(ccx+r,ccy);bl.arc(ccx,ccy,r,0,6.2832)}
    if(M>.04){const r=Math.sqrt(M)*cell*.62,px=ccx+cell*.3,py=ccy+cell*.22;pk.moveTo(px+r,py);pk.arc(px,py,r,0,6.2832)}}

  ctx.fillStyle=css(blue);for(const[x,y]of solid)ctx.fillRect(ox+x*P,oy+y*P,P,P);
}
function paintLines(ctx,b,ps,K,ox,oy,W,H,neon,frameHex){

  if(!neon){

    ctx.fillStyle="rgba(255,255,255,.12)";
    for(let x=ox;x<=ox+b.w*P;x+=16*P)ctx.fillRect(x,0,1,H);

  const shp=k=>SHAPE[k]||"wall",sh=(x,y)=>{const s=shp(b.p[y][x]);return SPECK.includes(s)?"glass":s};
  const segs={},specks={};
